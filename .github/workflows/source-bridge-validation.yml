name: Source bridge validation
on:
  push:
    branches: [codex/source-bridge-validation-20261015]
    paths:
      - .github/workflows/source-bridge-validation.yml
      - scripts/fetch_public_source_panel.py
      - scripts/recover_source_bridge.py
      - scripts/recover_public_expression.py
      - src/lung/data/source_bridge.py
      - src/lung/data/external_gene_axis.py
      - tests/test_source_bridge.py
permissions:
  contents: read
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU data-validation dependencies
        run: >-
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
          pyarrow==26.0.0 pytest==9.0.2 PyYAML==6.0.3
          scikit-learn==1.8.0 rdkit==2025.09.4
      - name: Install the project CPU test runtime
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Record exact source and environment
        run: |
          mkdir -p cloud-receipt/verification
          git bundle create cloud-receipt/repository.bundle HEAD refs/remotes/origin/main
          git bundle verify cloud-receipt/repository.bundle
          git rev-parse HEAD > cloud-receipt/commit.txt
          python --version > cloud-receipt/python.txt
          python -m pip freeze > cloud-receipt/python-packages.txt
          sha256sum cloud-receipt/repository.bundle > cloud-receipt/SHA256SUMS
      - name: Test changed behavior and adjacent consumers
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_bridge.py tests/test_external_gene_axis.py tests/test_public_expression_recovery.py tests/test_sarin_gene_mapping.py tests/test_science_evaluation_comparison.py tests/test_damtc_reference.py tests/test_sciplex2_dose_audit.py --junitxml=cloud-receipt/verification/pytest.xml 2>&1 | tee cloud-receipt/verification/pytest.txt
      - name: Fetch bounded public sources with hash receipts
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/fetch_public_source_panel.py --output cloud-receipt/sources 2>&1 | tee cloud-receipt/verification/download.txt
      - name: Recover actual source-bound expression and condition links
        shell: bash
        run: |
          set -euo pipefail
          S=cloud-receipt/sources
          O=cloud-receipt/results
          python -u scripts/recover_source_bridge.py --sources "$S" --output "$O/public-axis" 2>&1 | tee cloud-receipt/verification/public-axis.txt
          A="$O/public-axis/genes.parquet"
          python -u scripts/recover_public_expression.py hm97662 --soft "$S/HM_family.soft.gz" --matrix "$S/HM_counts.tsv.gz" --gene-axis "$A" --output "$O/hm97662" 2>&1 | tee cloud-receipt/verification/hm97662.txt
          python -u scripts/recover_public_expression.py gse161800 --soft "$S/GSE161800.soft.gz" --matrix "$S/GSE161800_1vs2_counts.csv.gz" --extra-matrix "$S/GSE161800_7vs8_counts.csv.gz" --paper-xml "$S/GSE161800_paper.xml" --gene-axis "$A" --output "$O/pulse" 2>&1 | tee cloud-receipt/verification/pulse.txt
          python -u scripts/recover_public_expression.py sarin --soft "$S/GSE108214.soft.gz" --annexin-docx "$S/Sarin_S8.docx" --gene-axis "$A" --hgnc "$S/hgnc_complete_set.txt" --gtf "$S/Homo_sapiens.GRCh37.75.gtf.gz" --output "$O/sarin" 2>&1 | tee cloud-receipt/verification/sarin.txt
          python -u scripts/recover_public_expression.py gse96779 --soft "$S/GSE96779.soft.gz" --matrix "$S/GSE96779.fpkm.gz" --output "$O/history" 2>&1 | tee cloud-receipt/verification/history.txt
      - name: Check complete manifests and immutable source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('cloud-receipt/results')
          summary={}
          for name in ('public-axis','hm97662','pulse','sarin','history'):
              folder=root/name
              m=json.loads((folder/'manifest.json').read_text())
              for file,expected in m['outputs'].items():
                  actual=hashlib.file_digest((folder/file).open('rb'),'sha256').hexdigest()
                  assert actual==expected,(name,file)
              assert not m['validation'].get('model_input_ready',False)
              summary[name]=m['validation']
          (root/'verified_manifest_summary.json').write_text(json.dumps(summary,indent=2))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-bridge-verified-data
          path: cloud-receipt/
          if-no-files-found: error
          retention-days: 14
