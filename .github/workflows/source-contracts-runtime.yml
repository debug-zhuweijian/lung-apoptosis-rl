name: Source contracts CPU dependencies
on:
  push:
    branches: [codex/source-contracts-20261015]
    paths: [.github/workflows/source-contracts-runtime.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download missing test-only runtime wheels; no training
        run: |
          set -eu
          mkdir wheels
          python -m pip download --only-binary=:all: --no-deps tensorboard==2.20.0 markdown==3.10 werkzeug==3.1.3 tensorboard-data-server==0.7.2 -d wheels
          sha256sum wheels/*.whl > wheels/SHA256SUMS
          python --version > wheels/python.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-contracts-cpu-wheels
          path: wheels/
          retention-days: 14
          if-no-files-found: error
