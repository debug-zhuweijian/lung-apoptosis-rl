name: Cloud processed source check
on:
  push:
    branches: ['codex/data-chain-closure-20261015']
    paths: ['.github/workflows/cloud-processed-source-check.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve small processed-source metadata; no FASTQ or aligner runs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install requests
          python - <<'PY'
          import gzip,hashlib,json,subprocess,sys
          from pathlib import Path
          from datetime import datetime,timezone
          import requests
          out=Path('processed-source-check');out.mkdir();rows=[]
          def get(url,name):
              p=out/name;p.parent.mkdir(parents=True,exist_ok=True)
              row={'url':url,'path':name,'retrieved_utc':datetime.now(timezone.utc).isoformat()}
              try:
                  with requests.get(url,stream=True,timeout=(15,45)) as r:
                      r.raise_for_status();row.update(resolved_url=r.url,content_type=r.headers.get('Content-Type'),etag=r.headers.get('ETag'),last_modified=r.headers.get('Last-Modified'))
                      if int(r.headers.get('Content-Length','0'))>40000000:raise ValueError('not a selected small metadata source')
                      n=0;sha=hashlib.sha256()
                      with p.with_suffix(p.suffix+'.partial').open('xb') as h:
                          for c in r.iter_content(65536):
                              n+=len(c)
                              if n>40000000:raise ValueError('not a selected small metadata source')
                              h.write(c);sha.update(c)
                  part=p.with_suffix(p.suffix+'.partial')
                  if p.suffix=='.gz':gzip.decompress(part.read_bytes())
                  row.update(bytes=n,sha256=sha.hexdigest(),status='downloaded_snapshot');part.rename(p)
              except Exception as e:row.update(status='failed',error=str(e))
              rows.append(row);(out/'retrieval_receipt.json').write_text(json.dumps(rows,indent=2));print(json.dumps(row),flush=True)
              return p if row['status'].startswith('downloaded') else None
          path='human/data_sources/sra/metadata/sra.recount_project.MD.gz'
          p=get('https://recount-opendata.s3.amazonaws.com/recount3/release/'+path,'recount3/sra.recount_project.MD.gz')
          if not p:p=get('https://data.idies.jhu.edu/recount3/data/'+path,'recount3/idies.sra.recount_project.MD.gz')
          if p:
              lines=gzip.decompress(p.read_bytes()).decode().splitlines()
              targets=['ERP125910','E-MTAB-9923']+['ERR5000'+str(n) for n in range(295,307)]
              hits=[s for s in lines if any(t in s for t in targets)]
              (out/'recount3/bothe_lookup.json').write_text(json.dumps({'query_identifiers':targets,'header':lines[0],'line_count':len(lines),'matching_lines':hits,'absence_is_limited_to_this_inventory':True},indent=2))
          get('https://www.ebi.ac.uk/fg/rnaseq/api/','rnaseq-er/index.html')
          get('https://www.ebi.ac.uk/fg/rnaseq/api/json/70/getStudy/ERP125910','rnaseq-er/study.json')
          get('https://www.ebi.ac.uk/gxa/experiments/E-MTAB-9923','atlas/experiment.html')
          get('https://api.crossref.org/works/10.1016%2Fj.cell.2012.03.031','lee/crossref.json')
          # Public package distribution only; do not install/execute a model remotely.
          p=get('https://pypi.org/pypi/scar/0.6.0/json','scar/pypi_0.6.0.json')
          if p:
              j=json.loads(p.read_text())
              wheel=[r for r in j['urls'] if r['filename'].endswith('.whl')]
              if wheel:
                  r=wheel[0];q=get(r['url'],'wheels/'+r['filename'])
                  if q and hashlib.sha256(q.read_bytes()).hexdigest()!=r['digests']['sha256']:raise ValueError('PyPI wheel digest mismatch')
          (out/'wheels').mkdir(exist_ok=True)
          cmd=[sys.executable,'-m','pip','download','--no-deps','--only-binary=:all:','--dest',str(out/'wheels'),'pyro-ppl==1.9.1','pyro-api==0.1.2','scanpy==1.11.5','anndata==0.12.3','natsort==8.4.0','legacy-api-wrap==1.4.1','session-info2==0.2.3','umap-learn==0.5.9.post2','pynndescent==0.5.13','array-api-compat==1.12.0','zarr==3.1.3','numcodecs==0.16.3','donfig==0.8.1.post1','google-crc32c==1.7.1']
          p=subprocess.run(cmd,text=True,capture_output=True);(out/'pip_download.txt').write_text(p.stdout+'\n'+p.stderr)
          (out/'wheel_sha256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (out/'wheels').iterdir()},indent=2))
          print('Optional dependency staging exit:',p.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-processed-source-check
          path: processed-source-check/
          if-no-files-found: error
          retention-days: 14
