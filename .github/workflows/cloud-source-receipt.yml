name: Cloud source receipt
on:
  push:
    branches: ['codex/data-chain-closure-20261015']
    paths: ['.github/workflows/cloud-source-receipt.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact review branch without credentials or research data
        shell: bash
        run: |
          set -euo pipefail
          mkdir receipt
          git rev-parse HEAD > receipt/branch_head.txt
          git merge-base --is-ancestor 4a78560bdeb2e0d98332d5a9520764a120abf612 HEAD
          git branch cloud-review-export HEAD
          git bundle create receipt/review.bundle refs/heads/cloud-review-export
          git bundle verify receipt/review.bundle
          git diff --binary 4a78560bdeb2e0d98332d5a9520764a120abf612 HEAD > receipt/review.patch
          sha256sum receipt/review.bundle receipt/review.patch > receipt/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-source-receipt
          path: receipt/
          retention-days: 14
          if-no-files-found: error
