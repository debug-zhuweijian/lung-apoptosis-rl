# Single-member latent response training and frozen-model evaluation.
members: 1
lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
conditions_per_update: 16
# The latent CFM path uses ot_samples for both the OT pool and sampled pairs.
ot_samples: 128
mmd_samples: 32
microbatch: 128
inference_microbatch: 128
# Used only when research.latent.refine.enabled is true.
train_ode_steps: 32
inference_ode_steps: 128
model:
  backbone: compact_full_gene
  n_genes: 32461
  d_model: 256
  n_heads: 4
  encoder_layers: 2
  pad_layers: 6
  query_chunk: 4096
  checkpoint_blocks: false
  checkpoint_attention: false
  n_backgrounds: 1
  n_sources: 2
  n_protocols: 1
  context_dim: 32
  sigma_min: 0.001
