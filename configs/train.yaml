# Shared defaults for the retained single-stage training and evaluation helpers.
# The root train.py entry uses configs/modular_research.yaml.
workflow: single
stage: all
task: PROXY-A549-V1
algorithm: both
epochs: 1000
early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.0001
  min_updates: 1000
# Stop on permitted validation convergence, never on a wall-clock quota.
training_control:
  validation_every_epochs: 1
data_loading:
  row_cache:
    use_disk_cache: true
    max_cache_bytes: 0
seed: 20260923
device: cuda:0
num_workers: 0
progress: true
data: configs/dataset.yaml
synthetic: false
auto_prepare: true
pipeline: null
state_fold: 1_to_8
state_batch: 64
aux_batch: 16
aux_lr: 0.0001
calibration_steps: 2000
calibration_lr: 0.01
endpoint_manifest: null
population: 512
scoring_repeats: 32
policy_seeds: [0, 1, 2, 3, 4]
decision_validation_repeats: 32
history_support: single_exposure_only
protocol: null
reward:
  gamma: 1.0
  shaping: none
