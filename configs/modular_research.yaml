# PyCharm: select a stage explicitly, e.g. train.py --stage ae.
workflow: modular_research
stage: all
task: PROXY-A549-V1
algorithm: daac
seed: 20261007
device: cuda:0
num_workers: 0
progress: true
data: configs/dataset.yaml
pipeline: null
epochs: 1000
early_stopping: {enabled: true, patience: 20, min_delta: 0.0001, min_updates: 1000}
training_control:
  validation_every_epochs: 1
data_loading:
  row_cache: {use_disk_cache: true, max_cache_bytes: 0}
state_fold: 1_to_8
state_batch: 64
aux_batch: 16
aux_lr: 0.0001
calibration_steps: 2000
calibration_lr: 0.01
state_loss: weighted_ce
state_aggregate_lambda: 0.0
population: 512
scoring_repeats: 4
decision_validation_repeats: 32
policy_seeds: [0]
history_support: single_exposure_only
protocol: null
reward: {gamma: 1.0, shaping: none}
research:
  precision: {mode: bf16}
  latent:
    d_model: 256
    latent_dim: 256
    coupling_space: latent
    refine: {enabled: false}
    ae: {batch: 128, lr: 0.0001}
daac:
  warmup_transitions: 256
  batch_size: 256
  actor_schedule: {drug: 20, dose: 20, joint: 160}
modular:
  # Existing immutable artifacts can be declared here, e.g. representation: .../latent_ae/best.pt
  artifacts: {}
  # Local training has no wall-clock limit; use early stopping / training targets.
  stages:
    ae: {epochs: 1000}
    cache: {}
    response: {epochs: 1000}
    pool: {epochs: 1000}
    state: {epochs: 1000}
    daac: {}
