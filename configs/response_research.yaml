# Independent response research entry (task W1). Runs the selected arms or
# latent stages only; never starts the registered 19-task suite, E/final_test
# or downstream RL. PyCharm: run train_response_research.py without arguments.
workflow: response_research
stage: response
task: RESPONSE-A549-V1
algorithm: both
seed: 20260923
device: cuda:0
num_workers: 0
progress: true
dashboard: true
open_browser: true
data: configs/dataset.yaml
save_period: 10
synthetic: false
auto_prepare: false
pipeline: null
epochs: 1000
early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.0001
  min_updates: 1000
training_control:
  validation_every_epochs: 1
  checkpoint_every_updates: 0
  checkpoint_every_seconds: 60
data_loading:
  row_cache:
    use_disk_cache: true
    max_cache_bytes: 0
population: 512
research:
  # route_compare | v_compare | latent_ae | latent_cache | latent_cfm | latent_members
  mode: route_compare
  # Single-member development screening; no ensemble or significance claim.
  arms: [full, cfm_only, cfm_then_full]
  # Optional resumable wall-clock development budget; null = no quota.
  budget_seconds: null
  precision:
    # bf16: dense forwards under CUDA BF16 autocast, everything else registered
    # FP32/FP64 (task 3.3). Strict control lives in response_research_fp32.yaml.
    mode: bf16
  timing:
    enabled: true
  latent:
    latent_dim: 256
    d_model: 256
  v_compare:
    weights: []  # entries: {name: <arm label>, path: <best.pt path>}
  # ---- Cross-run staged usage (S09 protocol; each stage is its own run_id) ----
  # Resuming the SAME run cannot change mode, so run each stage as a new run and
  # pass the previous stage's artifacts explicitly:
  #   1) train_response_research.py --mode latent_ae   --run-id rr-ae
  #   2) train_response_research.py --mode latent_cache --run-id rr-cache
  #      with research.latent.ae_checkpoint: checkpoints/rr-ae/latent_ae/best.pt
  #   3) train_response_research.py --mode latent_cfm   --run-id rr-cfm
  #      with research.latent.ae_checkpoint: checkpoints/rr-ae/latent_ae/best.pt
  #      and  research.latent.cache_dir:    checkpoints/rr-cache/latent_cache
  # Within one run (no --resume), stages also pick up this run's own
  # latent_stage_state.json / default directories automatically.
response:
  members: 1
  member_workers: 1
